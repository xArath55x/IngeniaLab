name: CI

on:
  pull_request:
    branches: [main, "it-*"]
  push:
    branches: [main, "it-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ingenialab

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ingenialab/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar la configuración de Django
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones y cargar datos semilla
        run: |
          python manage.py migrate --noinput
          python manage.py seed_ingenialab

      - name: Ejecutar pruebas
        run: python manage.py test apps

      # ACT-214C: recorrido de los cinco casos de uso sobre una BD de staging.
      # Sin Java/Graphviz en el runner, el diagrama usa el respaldo SVG.
      - name: Prueba end-to-end en staging
        run: python scripts/e2e_staging.py --allow-plantuml-fallback

      - name: Publicar evidencia end-to-end
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-py${{ matrix.python-version }}
          path: |
            ingenialab/var/staging/e2e_report.json
            ingenialab/var/staging/reporte_e2e.pdf
            ingenialab/var/staging/server.log
          if-no-files-found: ignore
