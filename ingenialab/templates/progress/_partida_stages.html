<ol class="partida-stages" aria-label="Etapas de la partida">
  {% for s in stages %}
  <li class="partida-stage{% if s.done %} done{% elif s.current %} current{% endif %}"{% if s.current %} aria-current="step"{% endif %}>
    <span class="partida-dot" aria-hidden="true">
      <span class="partida-icon partida-icon--{{ s.label|slugify }}"></span>
    </span>
    <div class="partida-stage-body">
      <div class="partida-stage-name">{{ s.label }}</div>
      {% if s.detail %}<div class="small muted">{{ s.detail }}</div>{% endif %}
      {% if s.done or s.current %}<span class="stage-status">{% if s.done %}Completada{% else %}Aquí vas{% endif %}</span>{% endif %}
    </div>
  </li>
  {% endfor %}
</ol>
